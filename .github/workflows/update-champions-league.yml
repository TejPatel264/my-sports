name: Update Champions League fixtures (weekly)

on:
  schedule:
    # 02:00 UTC every Thursday. CL only needs a weekly refresh - matchdays
    # are roughly a month apart, unlike the daily-moving PL/Championship
    # tables - so this runs on its own, lighter schedule rather than
    # piggybacking on update-fixtures.yml.
    - cron: "0 2 * * 4"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the updated data file back to the repo

jobs:
  update-champions-league:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update Champions League fixtures
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/update-champions-league.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/champions-league-events.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Champions League fixtures [automated]"
            git push
          fi
