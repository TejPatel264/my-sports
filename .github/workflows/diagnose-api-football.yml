name: Diagnose api-football.com (manual)

on:
  workflow_dispatch: {} # only runs when you click "Run workflow" - no schedule

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run diagnostic
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/diagnose-api-football.js
        # Read-only: just prints to this step's log, doesn't touch any data
        # files, so there's nothing to commit afterwards.
