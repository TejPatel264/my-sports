name: Update cricket fixtures (weekly)

on:
  schedule:
    # 03:00 UTC every Sunday. Each run re-downloads whole-competition zip
    # archives from cricsheet.org for all 16 sources (some containing
    # thousands of matches) since there's no incremental/diff download
    # option - daily would just be re-fetching the same data far more often
    # than it actually changes.
    - cron: "0 3 * * 0"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the updated data files back to the repo

jobs:
  update-cricket:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update cricket fixtures
        run: node scripts/update-cricket.js
        # No API key needed - cricsheet.org's downloads are public zip files,
        # no auth required. `unzip` is required on PATH and is preinstalled
        # on ubuntu-latest runners.

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cricket-events.json data/cricket-teams.json data/cricket-seasons.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update cricket fixtures [automated]"
            git push
          fi
