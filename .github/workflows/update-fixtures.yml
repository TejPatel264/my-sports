name: Update football fixtures (daily)

on:
  schedule:
    # Once a day, 04:00 UTC. Champions League runs separately, once a week,
    # at a different time (see update-champions-league.yml) - spacing these
    # out is just being considerate of football-data.org's free-tier rate
    # limit, even though two calls a few seconds apart is well within it.
    - cron: "0 4 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the updated data files back to the repo

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update Premier League fixtures
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/update-epl.js

      - name: Update Championship fixtures
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/update-championship.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/epl-events.json data/championship-events.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update football fixtures [automated]"
            git push
          fi
