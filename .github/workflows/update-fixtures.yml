name: Update football fixtures

on:
  schedule:
    # Once a day, 06:00 UTC. Adjust as you like - GitHub Actions cron can
    # run a little late during busy periods, that's normal and fine here.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed to commit the updated data files back to the repo

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update Premier League fixtures
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/update-epl.js

      - name: Update Championship fixtures
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/update-championship.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/epl-events.json data/championship-events.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update football fixtures [automated]"
            git push
          fi
